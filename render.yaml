services:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. EDITH REST API Service
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: edith-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: npm run migrate && npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MESSAGE_BROKER
        value: redis
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: edith-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ─────────────────────────────────────────────────────────────────────────
  # 2. EDITH WebSocket Gateway (Real-Time Live Streaming)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: edith-websocket
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: npm run start:wsg
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MESSAGE_BROKER
        value: redis
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: edith-api
          envVarKey: JWT_SECRET

databases:
  # ─────────────────────────────────────────────────────────────────────────
  # Managed PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────────────
  - name: edith-postgres
    databaseName: vaic
    user: vaic
    plan: free
    region: oregon
