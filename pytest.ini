[pytest]
asyncio_mode = auto
testpaths = services
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath =
    services/classification-engine
    services/conflict-detector
    services/transcription-engine
    services/report-generator
    services/voice-synthesis-engine
norecursedirs = node_modules .git __pycache__ .venv dist build
