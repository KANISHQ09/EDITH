name: Deploy — Production (Canary)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'DEPLOY' to confirm production deployment"
        required: true
      canary_weight:
        description: "Initial canary traffic percentage (default: 5)"
        default: "5"

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  pre-deploy-check:
    name: Pre-Deploy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Verify intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "ERROR: Must type DEPLOY to confirm production deployment"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify staging is healthy
        run: |
          aws eks update-kubeconfig --name vaic-staging --region ${{ secrets.AWS_REGION }}
          kubectl rollout status deployment --namespace vaic-staging --timeout=60s

  canary-deploy:
    name: Canary Deploy (${{ github.event.inputs.canary_weight }}%)
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy canary
        run: |
          aws eks update-kubeconfig --name vaic-production --region ${{ secrets.AWS_REGION }}
          helm upgrade --install vaic ./infrastructure/helm/vaic \
            --namespace vaic-production \
            --set global.imageTag=${{ github.sha }} \
            --set global.ecrRegistry=${{ env.ECR_REGISTRY }} \
            --set global.environment=production \
            --set global.canaryWeight=${{ github.event.inputs.canary_weight }} \
            --values ./infrastructure/helm/vaic/values.production.yaml \
            --wait --timeout=15m

      - name: Monitor canary error rate (15 min)
        run: |
          echo "Monitoring canary for 15 minutes..."
          sleep 900
          # Query CloudWatch for error rate
          ERROR_RATE=$(aws cloudwatch get-metric-statistics \
            --namespace VAIC/Production \
            --metric-name ErrorRate5xx \
            --dimensions Name=Environment,Value=production \
            --start-time $(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --period 900 \
            --statistics Average \
            --query 'Datapoints[0].Average' \
            --output text)
          echo "Error rate: ${ERROR_RATE}%"
          if (( $(echo "$ERROR_RATE > 1.0" | bc -l) )); then
            echo "ERROR: Error rate ${ERROR_RATE}% exceeds 1% threshold — triggering rollback"
            exit 1
          fi
          echo "✓ Canary healthy — proceeding to full rollout"

  full-rollout:
    name: Full Production Rollout
    runs-on: ubuntu-latest
    needs: canary-deploy
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Roll out to 100%
        run: |
          aws eks update-kubeconfig --name vaic-production --region ${{ secrets.AWS_REGION }}
          helm upgrade vaic ./infrastructure/helm/vaic \
            --namespace vaic-production \
            --set global.imageTag=${{ github.sha }} \
            --set global.canaryWeight=100 \
            --values ./infrastructure/helm/vaic/values.production.yaml \
            --wait --timeout=15m

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: "#deployments"
          slack-message: |
            ${{ job.status == 'success' && '✅' || '❌' }} Production deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  rollback:
    name: Auto Rollback
    runs-on: ubuntu-latest
    needs: canary-deploy
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback to previous release
        run: |
          aws eks update-kubeconfig --name vaic-production --region ${{ secrets.AWS_REGION }}
          helm rollback vaic --namespace vaic-production
          echo "🚨 Production rollback complete"
